apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
spec:
  template:
    spec:
      containers:
        - name: ingest
          image: recipe-finder-backend:v1
          imagePullPolicy: Never
          command: ["uv", "run", "python", "-m", "pipeline.retriever"]
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
      restartPolicy: OnFailure
